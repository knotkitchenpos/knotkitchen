# =============================================================================
# Knot Kitchen — production docker-compose
# =============================================================================
# One VPS. Six services. All application containers are on an internal Docker
# network and only reachable through Caddy on the host's 80/443 ports.
#
# Usage on the VPS:
#   cd /srv/knot
#   cp deploy/.env.production.example deploy/.env   # fill in real values
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env pull
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# Never publish anything but 80/443 to the host — the backend/frontend ports
# are internal only. All authentication, tenancy and rate limiting is enforced
# behind the proxy.

name: knotkitchen

networks:
  knot:
    driver: bridge

# -----------------------------------------------------------------------------
# Volumes.
#
# The three volumes below marked `external: true` hold data that exists NOWHERE
# ELSE and cannot be regenerated: restaurant compliance documents, and the
# onboarding portal's own database. Compose does not manage external volumes,
# which is the point — `docker compose down -v` and `docker volume prune` both
# leave them alone. Those two commands are the realistic way this data dies,
# because they get typed by hand during an incident.
#
# The trade-off: they must EXIST before `docker compose up`, or compose refuses
# to start. `deploy/bootstrap-volumes.sh` creates them idempotently and the
# deploy workflow runs it first, so this is handled automatically — but if you
# bring the stack up by hand on a fresh host, run that script first.
#
# `name:` pins each to the identifier compose was already using
# (project "knotkitchen" + volume name), so switching an existing deployment to
# external binds to the SAME volume. No migration, no data movement.
#
# caddy_data / caddy_config / backend_uploads stay compose-managed: certs
# re-issue themselves and media is comparatively replaceable.
# -----------------------------------------------------------------------------
volumes:
  caddy_data:      # ACME certs, OCSP staples — MUST persist across restarts
  caddy_config:
  backend_uploads: # only used when MEDIA_STORAGE_PROVIDER=local (dev/small deploys)

  csd_documents:   # restaurant KYC/compliance documents — never served statically
    external: true
    name: knotkitchen_csd_documents
  onboard_data:    # onboard-portal's server/data/database.json (agents + agreements)
    external: true
    name: knotkitchen_onboard_data
  onboard_uploads: # onboard-portal's uploaded KYC documents
    external: true
    name: knotkitchen_onboard_uploads

services:
  # ---------------------------------------------------------------------------
  # POS backend  →  api.${BASE_DOMAIN}
  # ---------------------------------------------------------------------------
  pos-api:
    build:
      context: ../pos-backend
      dockerfile: Dockerfile
    image: knotkitchen/pos-api:latest
    restart: unless-stopped
    networks: [knot]
    environment:
      NODE_ENV: production
      PORT: "8000"

      # === Secrets ===
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY:-15m}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY:-30d}

      # === CORS ===
      # Explicit hosts + wildcard base so any https://<slug>.${BASE_DOMAIN}
      # storefront may also call the API.
      # onboard.${BASE_DOMAIN} was removed along with the admin-web/admin-api
      # services (2026-08-30) — the CSD panel took over that surface.
      FRONTEND_URLS: >-
        https://${BASE_DOMAIN},https://csd.${BASE_DOMAIN},https://business.${BASE_DOMAIN},https://order.${BASE_DOMAIN}
      CORS_WILDCARD_DOMAINS: ${BASE_DOMAIN}
      BASE_DOMAIN: ${BASE_DOMAIN}
      COOKIE_SAMESITE: none
      COOKIE_SECURE: "true"

      # === Storefront ===
      STOREFRONT_BASE_URL: https://csd.${BASE_DOMAIN}
      STOREFRONT_ROOT_DOMAIN: ${BASE_DOMAIN}
      FRONTEND_URL: https://business.${BASE_DOMAIN}
      BACKEND_PUBLIC_URL: https://api.${BASE_DOMAIN}

      # === Customer-facing short links ===
      # The two URLs a diner actually reads. Both are vanity hosts in front of
      # routes that already existed, so links minted under the long form keep
      # working -- which matters because a printed QR card and a WhatsApp bill
      # link can never be reissued.
      #   bill.${BASE_DOMAIN}/<token>   ->  pos-api  /r/<token>
      #   order.${BASE_DOMAIN}/<token>  ->  pos-web  /t/<token>
      RECEIPT_PUBLIC_URL: ${RECEIPT_PUBLIC_URL:-https://bill.${BASE_DOMAIN}}
      # The single host website payments open on (Cashfree domain whitelist).
      PAYMENT_PUBLIC_URL: ${PAYMENT_PUBLIC_URL:-https://pay.${BASE_DOMAIN}}
      QR_PUBLIC_URL: ${QR_PUBLIC_URL:-https://order.${BASE_DOMAIN}}

      # === Media (object storage) ===
      # Default = local (files stored in the backend_uploads Docker volume and
      # served via https://api.${BASE_DOMAIN}/uploads). Switch to s3 /
      # cloudinary in deploy/.env if you outgrow the VPS disk.
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-local}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-https://api.${BASE_DOMAIN}/uploads}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}

      # === Payments / SMS ===

      # Cashfree PG. Platform-wide fallback for stores that have not entered
      # their own credentials under Website Settings.
      # CASHFREE_ENV: TEST = sandbox.cashfree.com, PROD = api.cashfree.com.
      # Anything unrecognised is treated as sandbox on purpose -- a typo here
      # should cost a failed test payment, not a real one.
      # Encrypts stored gateway credentials at rest. Absent, they are
      # stored Base64 exactly as before -- a missing key must not take
      # payments offline. configure-secrets.sh generates one.
      CREDENTIALS_SECRET: ${CREDENTIALS_SECRET:-}

      CASHFREE_APP_ID: ${CASHFREE_APP_ID:-}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:-}
      CASHFREE_ENV: ${CASHFREE_ENV:-TEST}
      CASHFREE_WEBHOOK_SECRET: ${CASHFREE_WEBHOOK_SECRET:-}
      CASHFREE_NOTIFY_URL: ${CASHFREE_NOTIFY_URL:-}

      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY:-}
      # DLT: the approved header, and the Message ID per template. With a
      # template id absent the message falls back to free text on route v3,
      # which is NOT DLT-compliant and which operators may drop.
      FAST2SMS_SENDER_ID: ${FAST2SMS_SENDER_ID:-}
      FAST2SMS_OTP_ID: ${FAST2SMS_OTP_ID:-}
      FAST2SMS_EBILL_TEMPLATE_ID: ${FAST2SMS_EBILL_TEMPLATE_ID:-}
      FAST2SMS_ORDER_READY_TEMPLATE_ID: ${FAST2SMS_ORDER_READY_TEMPLATE_ID:-}
      FAST2SMS_PAYMENT_LINK_TEMPLATE_ID: ${FAST2SMS_PAYMENT_LINK_TEMPLATE_ID:-}

      # WhatsApp. The approved e-bill template is a WhatsApp template, not a
      # DLT SMS one, so this is the live channel for e-bills. Both are needed
      # together -- with either missing, messagingService falls back to SMS.
      FAST2SMS_WHATSAPP_PHONE_NUMBER_ID: ${FAST2SMS_WHATSAPP_PHONE_NUMBER_ID:-}
      FAST2SMS_EBILL_WHATSAPP_MESSAGE_ID: ${FAST2SMS_EBILL_WHATSAPP_MESSAGE_ID:-}

      # Public receipt links (/r/<token>) sent to customers in the e-bill.
      # PUBLIC_API_URL is the origin they are built from; without it the link
      # cannot be built and the e-bill refuses to send rather than deliver a
      # broken one. RECEIPT_LINK_SECRET signs them -- unset, it falls back to
      # CREDENTIALS_SECRET and then JWT_SECRET. Changing whichever one is in
      # use invalidates every link already sent.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.${BASE_DOMAIN}}
      RECEIPT_LINK_SECRET: ${RECEIPT_LINK_SECRET:-}

      # Realtime
      SOCKET_ENABLED: "true"

      # === CSD panel ===
      CSD_JWT_SECRET: ${CSD_JWT_SECRET:-}
      CSD_TOKEN_EXPIRY: ${CSD_TOKEN_EXPIRY:-12h}
      # Seeds the CSD super-administrator on first pos-api start. Previously
      # only piped into admin-api (which we deleted); csdAuthController now
      # reads them here too, so they MUST be declared for the container to
      # see them — deploy/.env alone is not enough, compose only forwards
      # explicitly-listed keys. RESET_SUPERADMIN_PASSWORD=true is honoured
      # once on startup and then remove.
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      RESET_SUPERADMIN_PASSWORD: ${RESET_SUPERADMIN_PASSWORD:-}
      # Must match the csd_documents mount below.
      CSD_DOCUMENTS_DIR: /app/csd-documents
      # Agreement → store creation. Unset until the onboarding portal supports
      # a service token; CSD then makes no calls at all.
      ONBOARD_BASE_URL: ${ONBOARD_BASE_URL:-http://onboard-portal:3000}
      ONBOARD_SERVICE_TOKEN: ${ONBOARD_SERVICE_TOKEN:-}

    # Local uploads dir — only used if MEDIA_STORAGE_PROVIDER=local. Cloud
    # providers (S3-compatible / Cloudinary) write there and this volume
    # stays empty.
    volumes:
      - backend_uploads:/app/uploads
      # Restaurant compliance documents (GST, FSSAI, PAN/KYC, signed
      # agreements). A SEPARATE volume from backend_uploads on purpose:
      # /app/uploads is published publicly by express.static for menu photos,
      # and customer KYC must never be reachable that way. Nothing serves this
      # directory — the files stream through an authenticated CSD route.
      - csd_documents:/app/csd-documents

  # ---------------------------------------------------------------------------
  # POS SPA  →  business.${BASE_DOMAIN}
  # ---------------------------------------------------------------------------
  pos-web:
    build:
      context: ../pos-frontend
      dockerfile: Dockerfile
      args:
        # Vite bakes these into the JS bundle at build time.
        VITE_BACKEND_URL: https://api.${BASE_DOMAIN}
    image: knotkitchen/pos-web:latest
    restart: unless-stopped
    networks: [knot]

  # ---------------------------------------------------------------------------
  # Customer Support Desk SPA  →  csd.${BASE_DOMAIN}
  #
  # Internal staff tool. Talks to pos-api at https://api.${BASE_DOMAIN}/api/csd;
  # that origin is already in FRONTEND_URLS above and the API issues
  # SameSite=None cookies in production, so the cross-origin session works the
  # same way the POS already does.
  # ---------------------------------------------------------------------------
  csd-web:
    build:
      context: ../csd-web
      dockerfile: Dockerfile
      args:
        # src/api/index.js appends "/csd" to this.
        VITE_API_BASE_URL: https://api.${BASE_DOMAIN}/api
    image: knotkitchen/csd-web:latest
    restart: unless-stopped
    networks: [knot]

  # ---------------------------------------------------------------------------
  # Customer website  →  ${BASE_DOMAIN} + csd.${BASE_DOMAIN}
  # ---------------------------------------------------------------------------
  customer-web:
    build:
      context: ../customer-web
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: https://api.${BASE_DOMAIN}
        VITE_BASE_DOMAIN: ${BASE_DOMAIN}
        VITE_FALLBACK_SLUG: ${VITE_FALLBACK_SLUG:-}
    image: knotkitchen/customer-web:latest
    restart: unless-stopped
    networks: [knot]

  # ---------------------------------------------------------------------------
  # Partner Onboarding & Agreement portal  →  agreement.${BASE_DOMAIN}
  # Separate repo (knotkitchenpos/onboard), cloned as a sibling of this repo
  # at /srv/onboard on the VPS.
  # ---------------------------------------------------------------------------
  onboard-portal:
    build:
      context: ../../onboard
      dockerfile: Dockerfile
    image: knotkitchen/onboard-portal:latest
    restart: unless-stopped
    networks: [knot]
    environment:
      NODE_ENV: production
      PORT: "3000"
      ALLOWED_ORIGINS: https://agreement.${BASE_DOMAIN}
      AGENT_JWT_SECRET: ${ONBOARD_JWT_SECRET}
      # Only used to bootstrap an admin account if server/data/database.json
      # doesn't exist on the volume yet.
      ADMIN_USERNAME: ${ONBOARD_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ONBOARD_ADMIN_PASSWORD}
      # Shared secret that lets CSD read agreements and their uploaded
      # documents without an agent session. MUST match the value pos-api uses.
      # Unset = the portal accepts no service token at all and CSD reports the
      # connection as not configured, which is the correct inert default.
      ONBOARD_SERVICE_TOKEN: ${ONBOARD_SERVICE_TOKEN:-}
    volumes:
      - onboard_data:/app/server/data
      - onboard_uploads:/app/uploads

  # ---------------------------------------------------------------------------
  # Caddy reverse proxy — the only container that publishes host ports.
  # Uses Let's Encrypt HTTP-01 (Hostinger DNS, no Cloudflare) to obtain and
  # renew certificates for every hostname in deploy/Caddyfile automatically.
  # ---------------------------------------------------------------------------
  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    image: knotkitchen/caddy:latest
    restart: unless-stopped
    networks: [knot]
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Consumed by the Caddyfile via env placeholders.
      BASE_DOMAIN: ${BASE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      # Cloudflare API token (Zone:DNS:Edit, scoped to this zone only) — used
      # solely to obtain the *.${BASE_DOMAIN} wildcard cert via DNS-01. Every
      # other hostname still uses plain HTTP-01 and never touches Cloudflare.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./landing:/srv/landing:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - pos-api
      - onboard-portal
      - pos-web
      - customer-web
