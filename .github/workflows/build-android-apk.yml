name: Build Android APK

on:
  workflow_dispatch:
  # Native changes only. The app loads the live POS, so web changes reach it
  # without a build, and each build here asks every till to update.
  push:
    paths:
      - "pos-frontend/android/**"
      - "pos-frontend/capacitor.config.ts"
      - "pos-frontend/public/offline.html"
      - "pos-frontend/package.json"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

# Runs queue in order. Re-running an old run could republish an older build;
# installed apps never downgrade, so they just wait for the next one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ env.HAS_KEYSTORE }}
    env:
      KK_VERSION_CODE: ${{ github.run_number }}
      KK_VERSION_NAME: 1.0.${{ github.run_number }}
      # Release signing runs only once the keystore secrets exist. See
      # pos-frontend/android/app/build.gradle for how they are read.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pos-frontend/package-lock.json

      # Java 21, not 17: capacitor-android compiles with source/target
      # compatibility 21, so a 17 JDK fails the build with
      # "error: invalid source release: 21" at
      # :capacitor-android:compileDebugJavaWithJavac.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # packages: "" -- the action's default list still names "tools", which
      # the SDK no longer ships, and sdkmanager fails the whole job on it.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install frontend dependencies
        working-directory: pos-frontend
        run: npm ci

      - name: Build and sync Capacitor Android project
        working-directory: pos-frontend
        run: npm run cap:sync

      - name: Assemble debug APK
        working-directory: pos-frontend/android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: knotkitchen-pos-debug-apk
          # Paths are relative to the workspace root, not the step's
          # working-directory.
          path: pos-frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build signed release APK and App Bundle
        if: env.HAS_KEYSTORE == 'true'
        working-directory: pos-frontend/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export KK_KEYSTORE_PATH="$RUNNER_TEMP/knotkitchen-release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KK_KEYSTORE_PATH"
          ./gradlew assembleRelease bundleRelease
          rm -f "$KK_KEYSTORE_PATH"

      - name: Upload signed release
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: knotkitchen-pos-release
          path: |
            pos-frontend/android/app/build/outputs/apk/release/app-release.apk
            pos-frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  # Installed apps update themselves from the android-latest release
  # (ShellUpdater.java). Only release-signed builds from main: Android installs
  # an update only if it carries the same signature. Its own job, so the only
  # write token never runs npm or Gradle. The tag is created once and never
  # moved: the VPS deploy fetches tags and would refuse a moved one.
  publish-update:
    needs: build-apk
    if: needs.build-apk.outputs.signed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: android-latest
    steps:
      # Two paths in the artifact, so it is rooted at their common folder:
      # the APK lands at out/apk/release/app-release.apk.
      - uses: actions/download-artifact@v4
        with:
          name: knotkitchen-pos-release
          path: out

      - name: Publish to the android-latest release
        run: |
          cp out/apk/release/app-release.apk KnotKitchen-POS.apk
          printf '{"versionCode":%s,"versionName":"1.0.%s","apkUrl":"https://github.com/%s/releases/download/%s/KnotKitchen-POS.apk","sha256":"%s"}\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$GITHUB_REPOSITORY" "$TAG" "$(sha256sum KnotKitchen-POS.apk | cut -d' ' -f1)" > android-update.json
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --latest=false \
            --title "KnotKitchen POS for Android" \
            --notes "Install KnotKitchen-POS.apk below. Installed apps then update themselves. Do not delete this release."
          # APK first, manifest last: the manifest never names an APK not uploaded yet.
          gh release upload "$TAG" KnotKitchen-POS.apk --clobber
          gh release upload "$TAG" android-update.json --clobber
