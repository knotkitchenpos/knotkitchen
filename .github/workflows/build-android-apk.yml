name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "pos-frontend/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pos-frontend/package-lock.json

      # Java 21, not 17: capacitor-android compiles with source/target
      # compatibility 21, so a 17 JDK fails the build with
      # "error: invalid source release: 21" at
      # :capacitor-android:compileDebugJavaWithJavac.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install frontend dependencies
        working-directory: pos-frontend
        run: npm ci

      - name: Build and sync Capacitor Android project
        working-directory: pos-frontend
        run: npm run cap:sync

      - name: Assemble debug APK
        working-directory: pos-frontend/android
        run: ./gradlew assembleDebug

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: knotkitchen-pos-debug-apk
          # Paths are relative to the workspace root, NOT to the previous
          # step's working-directory. The Android project lives under
          # pos-frontend/, so the old `android/...` path pointed at nothing and
          # would have failed this step (if-no-files-found: error) even on a
          # successful build. The build has never got this far to show it.
          path: pos-frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error