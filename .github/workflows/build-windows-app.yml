name: Build Windows App

on:
  workflow_dispatch:
  push:
    paths:
      - "pos-desktop/**"
      - ".github/workflows/build-windows-app.yml"

permissions:
  contents: read

# Runs queue in order. Re-running an old run could republish an older build;
# installed apps never downgrade, so they just wait for the next one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      KK_VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pos-desktop/package-lock.json

      - name: Install dependencies
        working-directory: pos-desktop
        run: npm ci

      - name: Stamp version
        working-directory: pos-desktop
        run: npm pkg set version=$env:KK_VERSION

      - name: Smoke test (boots, lists printers, exits)
        working-directory: pos-desktop
        run: npm run smoke

      # Unsigned: Windows SmartScreen shows "unknown publisher" on first run.
      # A code-signing certificate (WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD
      # secrets) removes that; electron-builder picks them up automatically.
      - name: Build installer
        working-directory: pos-desktop
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist

      # The installer plus what installed apps update from: latest.yml names
      # the newest installer and its checksum; the blockmap makes the next
      # update a small differential download.
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: knotkitchen-pos-windows
          path: |
            pos-desktop/dist/*.exe
            pos-desktop/dist/*.exe.blockmap
            pos-desktop/dist/latest.yml
          if-no-files-found: error

  # Installed apps update themselves from the desktop-latest release
  # (pos-desktop/package.json build.publish, main.js startUpdates). Its own
  # job, so the only write token never runs npm. The tag is created once and
  # never moved: the VPS deploy fetches tags and would refuse a moved one.
  publish-update:
    needs: build-windows
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The VPS SSH secrets live in this environment (the same ones deploy.yml uses).
    environment: production
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: desktop-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: knotkitchen-pos-windows
          path: out

      - name: Publish to the desktop-latest release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --latest=false \
            --title "KnotKitchen POS for Windows" \
            --notes "Install the newest KnotKitchen-POS-Setup-*.exe below. Installed apps then update themselves. Do not delete this release."
          # Installer first, latest.yml last: the feed never names a file that is not there yet.
          # ponytail: installers accumulate (2 assets per build); prune old ones if the release gets unwieldy.
          gh release upload "$TAG" out/*.exe out/*.exe.blockmap --clobber
          gh release upload "$TAG" out/latest.yml --clobber

      # What installed apps update from (pos-desktop/package.json build.publish):
      # business.<base>/downloads/windows on our VPS. The repository is private,
      # so the GitHub release above needs a GitHub login. Installers first,
      # latest.yml last; the three newest installers stay.
      - name: Publish to business.knotkitchen.com/downloads/windows
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/deploy_key"
          install -m 600 /dev/null "$KEY"
          printf '%s\n' "$SSH_KEY" > "$KEY"
          OPTS=(-i "$KEY" -o StrictHostKeyChecking=no -o BatchMode=yes)
          DIR="$APP_PATH/deploy/downloads/windows"
          ssh "${OPTS[@]}" "$SSH_USER@$SSH_HOST" "mkdir -p '$DIR/.incoming'"
          scp "${OPTS[@]}" out/*.exe out/*.exe.blockmap out/latest.yml "$SSH_USER@$SSH_HOST:$DIR/.incoming/"
          # Single-quoted: the loop variables belong to the server's shell, not this one.
          ssh "${OPTS[@]}" "$SSH_USER@$SSH_HOST" "cd '$DIR'"' && set -e
            for f in .incoming/*.exe .incoming/*.exe.blockmap; do mv "$f" .; done
            mv .incoming/latest.yml latest.yml
            ls -1t *.exe | tail -n +4 | while read -r f; do rm -f "$f" "$f.blockmap"; done'
          rm -f "$KEY"
          curl -fsS https://business.knotkitchen.com/downloads/windows/latest.yml
