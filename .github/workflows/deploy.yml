# =============================================================================
# Knot Kitchen — Production deploy
# =============================================================================
# Triggered on push to `main` OR on manual dispatch. SSHes into the Hostinger
# VPS, pulls the new revision, records the previous SHA (for rollback), rebuilds
# only what changed, and health-checks before declaring success.
#
# Secrets required in GitHub → Settings → Secrets → Actions:
#   DEPLOY_SSH_HOST   — VPS hostname or IPv4
#   DEPLOY_SSH_USER   — deploy user (has sudo docker access)
#   DEPLOY_SSH_KEY    — private key matching the authorized_keys on the VPS
#   DEPLOY_APP_PATH   — absolute path to the checkout on the VPS (e.g. /srv/knot)
#
# The .env is NEVER committed — it lives only at DEPLOY_APP_PATH/deploy/.env on
# the VPS. See DEPLOYMENT.md for how to seed it the first time.

name: Deploy to VPS

"on":
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, SHA)"
        required: true
        default: "main"

concurrency:
  # A second deploy while one is in flight would race the container restarts —
  # queue instead of cancelling so the newest push always wins the last slot.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Rebuild + restart on Hostinger VPS
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://api.knotkitchen.online/health
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # StrictHostKeyChecking is off intentionally — the shared VPS's host
          # key can rotate on rebuild. Cloudflare's mTLS in front of SSH is
          # what protects the connection, not the SSH TOFU pin.
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_APP_PATH }}

            # Remember the current SHA before we move. rollback.sh reads this.
            git rev-parse HEAD > deploy/.previous || true

            echo "==> Fetching latest"
            git fetch --tags --prune origin

            REF="${{ github.event.inputs.ref || 'main' }}"
            echo "==> Checking out $REF"
            git checkout "$REF"
            git pull --ff-only origin "$REF" || true

            # The KYC/onboarding volumes are `external: true` so that a stray
            # `down -v` or `volume prune` cannot destroy them. Compose will not
            # create them itself, so ensure they exist first. Idempotent, and
            # never touches the contents of a volume that already exists.
            echo "==> Ensuring external volumes exist"
            bash deploy/bootstrap-volumes.sh

            echo "==> Building + starting containers"
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env build --pull
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --remove-orphans

            echo "==> Waiting for backend to become ready"
            # Poll /health via the internal Docker network — no reliance on DNS
            # so a broken deploy doesn't cause a false green from cached DNS.
            for i in $(seq 1 30); do
              if docker compose -f deploy/docker-compose.yml exec -T pos-api \
                   wget -qO- http://127.0.0.1:8000/health >/dev/null 2>&1; then
                echo "Backend healthy after ${i} attempts."
                exit 0
              fi
              sleep 2
            done
            echo "Backend never became healthy — check container logs."
            docker compose -f deploy/docker-compose.yml logs --tail=200 pos-api
            exit 1

      - name: Post-deploy smoke test
        if: success()
        run: |
          set -e
          echo "==> Public HTTPS smoke tests"
          # These MUST match the vhosts in deploy/Caddyfile. The previous list
          # (api./pos./admin..knotkitchen.com) named three hostnames that have
          # never existed, so `set -e` + `curl -f` failed every deploy here.
          curl -fsSI https://api.knotkitchen.online/health > /dev/null && echo "api       OK"
          curl -fsSI https://business.knotkitchen.online/  > /dev/null && echo "pos       OK"
          curl -fsSI https://onboard.knotkitchen.online/   > /dev/null && echo "onboard   OK"
          curl -fsSI https://csd.knotkitchen.online/       > /dev/null && echo "csd       OK"
          curl -fsSI https://knotkitchen.online/           > /dev/null && echo "customer  OK"
