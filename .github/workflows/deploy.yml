# =============================================================================
# Knot Kitchen — Production deploy
# =============================================================================
# Triggered on push to `main` OR on manual dispatch. SSHes into the Hostinger
# VPS, pulls the new revision, records the previous SHA (for rollback), rebuilds
# only what changed, and health-checks before declaring success.
#
# Secrets required in GitHub → Settings → Secrets → Actions:
#   DEPLOY_SSH_HOST   — VPS hostname or IPv4
#   DEPLOY_SSH_USER   — deploy user (has sudo docker access)
#   DEPLOY_SSH_KEY    — private key matching the authorized_keys on the VPS
#   DEPLOY_APP_PATH   — absolute path to the checkout on the VPS (e.g. /srv/knot)
#
# The .env is NEVER committed — it lives only at DEPLOY_APP_PATH/deploy/.env on
# the VPS. See DEPLOYMENT.md for how to seed it the first time.

name: Deploy to VPS

"on":
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, SHA)"
        required: true
        default: "main"

concurrency:
  # A second deploy while one is in flight would race the container restarts —
  # queue instead of cancelling so the newest push always wins the last slot.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Rebuild + restart on Hostinger VPS
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://api.knotkitchen.com/health
    steps:
      # Fail fast with a legible message. appleboy/ssh-action reports an
      # unreachable host as an opaque "dial tcp ***:22: i/o timeout" after 30s,
      # with the host masked, which is indistinguishable from a wrong secret.
      # This says which it is before we get there.
      - name: Preflight — can the runner reach the VPS on 22?
        run: |
          probe() {
            if timeout 10 bash -c "cat < /dev/null > /dev/tcp/$1/22" 2>/dev/null; then
              echo "  REACHABLE   $2"
            else
              echo "  UNREACHABLE $2"
            fi
          }
          echo "TCP 22 reachability from this runner:"
          probe "${{ secrets.DEPLOY_SSH_HOST }}" "DEPLOY_SSH_HOST (value masked)"
          probe "api.knotkitchen.com" "api.knotkitchen.com (public DNS -> VPS)"
          echo
          echo "If the public hostname is REACHABLE but DEPLOY_SSH_HOST is not,"
          echo "the secret holds the wrong value. If both are UNREACHABLE, the"
          echo "network path from GitHub to the VPS is blocked."

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # StrictHostKeyChecking is off intentionally — the shared VPS's host
          # key can rotate on rebuild. Cloudflare's mTLS in front of SSH is
          # what protects the connection, not the SSH TOFU pin.
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_APP_PATH }}

            # Remember the current SHA before we move. rollback.sh reads this,
            # and the Caddyfile check below diffs against it.
            PREV_SHA="$(git rev-parse HEAD)"
            echo "$PREV_SHA" > deploy/.previous || true

            echo "==> Fetching latest"
            git fetch --tags --prune origin

            REF="${{ github.event.inputs.ref || 'main' }}"
            echo "==> Checking out $REF"
            git checkout "$REF"

            # NOT `|| true`. A pull that cannot fast-forward -- because someone
            # edited a tracked file on the server -- used to be swallowed here,
            # so the job went green, `up -d` found nothing changed, and the
            # deploy silently ran the previous commit. Three days of "success"
            # deployed nothing at all. Fail here instead, and say what to do.
            if ! git pull --ff-only origin "$REF"; then
              echo "::error::Cannot fast-forward $REF. The checkout has local changes:"
              git status --porcelain
              echo "Commit them, or discard with 'git checkout -- <file>', then re-run."
              exit 1
            fi

            echo "==> Deploying $(git rev-parse --short HEAD)"

            # Did this pull change the reverse-proxy config? Recorded BEFORE
            # the build, and acted on after it. See the force-recreate below
            # for why a plain `up -d` is not enough.
            CADDY_CHANGED=0
            if ! git diff --quiet "$PREV_SHA" HEAD -- deploy/Caddyfile 2>/dev/null; then
              CADDY_CHANGED=1
              echo "    deploy/Caddyfile changed — caddy will be recreated"
            fi

            # The KYC/onboarding volumes are `external: true` so that a stray
            # `down -v` or `volume prune` cannot destroy them. Compose will not
            # create them itself, so ensure they exist first. Idempotent, and
            # never touches the contents of a volume that already exists.
            echo "==> Ensuring external volumes exist"
            bash deploy/bootstrap-volumes.sh

            echo "==> Building + starting containers"
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env build --pull
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --remove-orphans

            # The Caddyfile is bind-mounted as a FILE, so the mount is pinned to
            # the inode it had when the container started. git replaces a file
            # by writing a new one and renaming over it, which changes the
            # inode — so the container goes on serving the config it booted
            # with, and `up -d` sees no service change and leaves it running.
            #
            # Every Caddyfile change was silently ignored this way. A vhost
            # added on 2026-09-07 only took effect because somebody restarted
            # the container by hand, and the short-link hosts added later
            # resolved to the wildcard instead: bills went out pointing at a
            # host that served the storefront rather than the receipt.
            #
            # `caddy reload` does not help — it re-reads the same stale inode.
            # Recreating is what re-resolves the mount.
            if [ "$CADDY_CHANGED" = "1" ]; then
              echo "==> Recreating caddy to pick up the new Caddyfile"
              docker compose -f deploy/docker-compose.yml --env-file deploy/.env \
                up -d --force-recreate caddy
            fi

            echo "==> Waiting for backend to become ready"
            # Poll /health via the internal Docker network — no reliance on DNS
            # so a broken deploy doesn't cause a false green from cached DNS.
            for i in $(seq 1 30); do
              if docker compose -f deploy/docker-compose.yml exec -T pos-api \
                   wget -qO- http://127.0.0.1:8000/health >/dev/null 2>&1; then
                echo "Backend healthy after ${i} attempts."
                exit 0
              fi
              sleep 2
            done
            echo "Backend never became healthy — check container logs."
            docker compose -f deploy/docker-compose.yml logs --tail=200 pos-api
            exit 1

      - name: Post-deploy smoke test
        if: success()
        run: |
          set -e
          echo "==> Public HTTPS smoke tests"
          # These MUST match the vhosts in deploy/Caddyfile. The previous list
          # (api./pos./admin..knotkitchen.com) named three hostnames that have
          # never existed, so `set -e` + `curl -f` failed every deploy here.
          curl -fsSI https://api.knotkitchen.com/health > /dev/null && echo "api       OK"
          curl -fsSI https://business.knotkitchen.com/  > /dev/null && echo "pos       OK"
          curl -fsSI https://csd.knotkitchen.com/       > /dev/null && echo "csd       OK"
          curl -fsSI https://knotkitchen.com/           > /dev/null && echo "customer  OK"
