# -----------------------------------------------------------------------------
# customer-web — SPA nginx config
# -----------------------------------------------------------------------------
# One server block for every store: the store is resolved from the hostname
# (in the browser, and for the page <head> in pos-api).
#
# Only real pages get index.html with a 200: the home page, /menu and the
# /legal/<key> pages, at the root or under the /s/<slug> preview mount.
# Anything else is a 404 -- still the app (it shows "Page not found" with a way
# back), but with the status search engines need.
#
# Each page's <head> is pulled in from pos-api with SSI (see index.html and
# pos-backend services/storeHead.js), so link previews and crawlers that do not
# run JavaScript see the store's title, description and photo.

server {
    listen       80 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Docker's DNS, so pos-api is looked up per request: nginx still starts
    # (and serves the stand-in head) when pos-api is down.
    resolver 127.0.0.11 valid=30s ipv6=off;

    error_page 404 /404.html;

    # Small non-caching endpoint used by the Docker HEALTHCHECK. Returns 200
    # regardless of the store — it only proves nginx is serving.
    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # Every store host: allowed, bar the /s/<slug> preview copies.
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        return 200 "User-agent: *\nAllow: /\nDisallow: /s/\n\nSitemap: https://$host/sitemap.xml\n";
    }

    # The same seven pages on every store (src/lib/legalPages.js).
    # ponytail: answers on a subdomain with no store too; proxy to pos-api if that matters.
    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>https://$host/</loc><changefreq>daily</changefreq><priority>1.0</priority></url>
  <url><loc>https://$host/menu</loc><changefreq>daily</changefreq><priority>0.9</priority></url>
  <url><loc>https://$host/legal/terms</loc><priority>0.2</priority></url>
  <url><loc>https://$host/legal/privacy</loc><priority>0.2</priority></url>
  <url><loc>https://$host/legal/refund-cancellation</loc><priority>0.2</priority></url>
  <url><loc>https://$host/legal/return</loc><priority>0.2</priority></url>
  <url><loc>https://$host/legal/shipping-delivery</loc><priority>0.2</priority></url>
</urlset>
';
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # The page's <head>, for the SSI include in index.html. $request_uri and
    # $host are the visitor's own request.
    location = /__head {
        internal;
        set $pos_api http://pos-api:8000;
        proxy_set_header X-Store-Host $host;
        proxy_set_header X-Store-Path $request_uri;
        # Plain text back, so SSI can splice it in.
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
        proxy_pass $pos_api/api/public/store/head;
    }

    # Immutable, hash-named build assets: long cache + immutable so browsers
    # (and Cloudflare) can serve them without hitting origin.
    location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico|map)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The pages: home, /menu, /legal/<key>, bare or under /s/<slug>. Not
    # cached aggressively; a deploy must be picked up on the next request.
    location ~ ^(/s/[a-z0-9-]+)?(/menu|/legal/[a-z0-9-]+)?/?$ {
        ssi on;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Anything else is not a page.
    location / {
        try_files $uri =404;
    }

    # The app again, which shows "Page not found" and the way back; the
    # status stays 404.
    location = /404.html {
        internal;
        ssi on;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
}
