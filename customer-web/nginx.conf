# -----------------------------------------------------------------------------
# customer-web — SPA nginx config
# -----------------------------------------------------------------------------
# Every non-file request falls back to index.html so React Router (and the
# hostname-driven bootstrap) can render the correct store. There is NO
# per-store configuration in this file — the same server block handles every
# subdomain because tenant resolution happens in the browser + backend.

server {
    listen       80 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Small non-caching endpoint used by the Docker HEALTHCHECK. Returns 200
    # regardless of the store — it only proves nginx is serving.
    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # Immutable, hash-named build assets: long cache + immutable so browsers
    # (and Cloudflare) can serve them without hitting origin.
    location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico|map)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Root HTML — do NOT cache aggressively; a deploy must be picked up on the
    # next request.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # SPA fallback for React Router paths (/s/:slug, /order-history, etc.)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
