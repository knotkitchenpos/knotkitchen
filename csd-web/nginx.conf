# csd.<BASE_DOMAIN> — Customer Support Desk SPA
#
# Internal operations tool: staff sign in with an OTP and can read every
# restaurant's details, contacts and compliance documents. It is therefore
# locked down harder than the public storefront — no framing, no referrer
# leakage, and nothing here is cacheable except fingerprinted build assets.
server {
    listen       80 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # The push service worker keeps its name across releases, so it must never
    # be cached (the generic *.js rule below would pin old copies for a year).
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # App icons (public/icons) keep their names when the artwork changes, so
    # they must revalidate: under the forever rule below a redesigned icon
    # never reached a phone that had the old one. `^~` keeps that regex off
    # this folder. The manifest/index links also carry ?v=N to bust copies
    # cached before this rule existed.
    location ^~ /icons/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Vite fingerprints these filenames, so they are safe to cache forever.
    location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico|map)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # never cache the shell: a stale index.html pins staff to an old bundle
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
