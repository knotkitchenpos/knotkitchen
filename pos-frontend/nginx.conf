# pos.knotkitchen.com — POS SPA
server {
    listen       80 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico|map)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The owners' Partners dashboard (dist/partners, vite.partners.config.js),
    # reached at knotkitchen.com/partners/: its own app shell for every path.
    location /partners/ {
        try_files $uri $uri/ /partners/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # The KnotKitchen Rider app (dist/rider, vite.rider.config.js), reached at
    # knotkitchen.com/rider/. Its service worker is re-checked on every load,
    # so a new release reaches riders' phones at once.
    location = /rider/rider-sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /rider/ {
        try_files $uri $uri/ /rider/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        # The POS is a private tool — deny framing to reduce clickjacking.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
